<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ditto — Settings</title>
  <style>
    body {
      max-width: 480px;
      margin: 40px auto;
      padding: 0 20px;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1a1a1a;
    }
    h1 { font-size: 18px; }
    label { display: block; font-weight: 600; margin-top: 16px; }
    p.hint { color: #666; font-size: 12px; margin: 4px 0 0; }
    input[type="url"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
    }
    button {
      margin-top: 18px;
      padding: 9px 16px;
      border: none;
      border-radius: 8px;
      background: #1a7f5a;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #status { margin-top: 12px; font-size: 12px; color: #1a7f5a; }
  </style>
</head>
<body>
  <h1>Ditto backend settings</h1>
  <label for="backendUrl">Backend URL</label>
  <input type="url" id="backendUrl" placeholder="http://localhost:8080" />
  <p class="hint">
    Point this at your Ditto API — <code>http://localhost:8080</code> for local dev,
    or your deployed backend (e.g. Render/Cloud Run) URL. The backend's
    <code>CORS_ORIGINS</code> must allow this extension's origin.
  </p>
  <button id="save">Save</button>
  <p id="status"></p>

  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
