<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ditto</title>
  <style>
    :root { color-scheme: light; }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1a1a1a;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 4px;
    }
    #host {
      color: #666;
      font-size: 12px;
      word-break: break-all;
      margin: 0 0 14px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin: 10px 0 4px;
    }
    select, input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }
    .checkbox-row label { margin: 0; font-weight: 400; }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      background: #1a7f5a;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #a11;
      min-height: 16px;
    }
    #optionsLink {
      display: block;
      margin-top: 12px;
      font-size: 11px;
      text-align: center;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Ditto</h1>
  <p id="host">Loading current page…</p>

  <label for="disability">Rebuild for</label>
  <select id="disability">
    <option value="none">General accessibility</option>
    <option value="blind">Blind / screen reader</option>
    <option value="low_vision">Low vision</option>
    <option value="dyslexia">Dyslexia</option>
    <option value="deaf">Deaf / hard of hearing</option>
    <option value="adhd">ADHD / focus</option>
    <option value="tremor">Motor / tremor</option>
    <option value="elderly">Older reader</option>
  </select>

  <div class="checkbox-row">
    <input type="checkbox" id="simplify" />
    <label for="simplify">Simplify the language</label>
  </div>

  <button id="rebuild">Rebuild this page</button>
  <p id="status"></p>
  <a id="optionsLink" href="#">Backend settings</a>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
