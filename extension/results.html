<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ditto — Rebuilt page</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1a1a1a;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid #ddd;
      background: #fafafa;
    }
    header p { margin: 0; }
    #host { font-weight: 600; }
    #scores { color: #666; font-size: 12px; }
    a { color: #1a7f5a; }
    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 49px);
      border: none;
    }
    #empty {
      padding: 40px 20px;
      text-align: center;
      color: #666;
    }
  </style>
</head>
<body>
  <header id="bar" hidden>
    <div>
      <p id="host"></p>
      <p id="scores"></p>
    </div>
    <a id="original" target="_blank" rel="noreferrer noopener">View original ↗</a>
  </header>
  <div id="empty" hidden>No rebuilt page found. Try again from the Ditto popup.</div>
  <iframe id="frame" title="Rebuilt page" sandbox="allow-scripts allow-same-origin" hidden></iframe>

  <script src="results.js"></script>
</body>
</html>
